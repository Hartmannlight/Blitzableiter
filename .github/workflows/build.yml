name: Container Release
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/lint.yml
  container:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: Hartmannlight/pipeline-toolkit/actions/build@abb469f033ee28e00ba1061a47dddfc7d961129a
      with:
        target: runtime
    - name: Runtime smoke test
      run: |
        docker run -d --name app-test candidate:gate
        trap 'docker rm -f app-test' EXIT
        for attempt in {1..30}; do
          if docker exec app-test python -m app.health; then exit 0; fi
          sleep 2
        done
        docker logs app-test
        exit 1
    - uses: Hartmannlight/pipeline-toolkit/actions/scan@abb469f033ee28e00ba1061a47dddfc7d961129a
    - if: github.event_name != 'pull_request'
      uses: Hartmannlight/pipeline-toolkit/actions/publish@abb469f033ee28e00ba1061a47dddfc7d961129a
      with:
        image: ghcr.io/hartmannlight/blitzableiter
        token: ${{ secrets.GITHUB_TOKEN }}
    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: container-reports
        path: artifacts/
        retention-days: 14
  maintenance-gate:
    name: ci-gate
    if: always()
    needs:
    - validate
    - container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every check
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        failed = {name: value['result'] for name, value in results.items() if value['result'] not in ('success',)}
        if failed:
            raise SystemExit(str(failed))
        PY
